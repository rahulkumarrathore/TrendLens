formula: COUNT(DISTINCT order_id) completed
grain: day x region x category
parents: []
fed_by:
- sales.orders
freshness_rule: source
drivers:
- coupon_expiry
- competitor_promo
thresholds:
  sigma: 2.0
  min_impact_inr: 8000
levers:
  coupon_expiry: promotional_pricing
persistence_n: 2
kpi: orders
access:
  cfo:
    rows: all
    columns: all
    domains: all
  north_manager:
    rows: region='North'
    columns_exclude:
    - margin
    - cogs
    domains_exclude:
    - marketing
  marketing_exec:
    rows: all
    columns_exclude:
    - margin
    - cogs
    - return_reason
    domains_exclude:
    - returns_detail
  analyst_intern:
    rows: all
    columns_exclude:
    - sku
    - discount_pct
    min_grain: category
    domains_only:
    - gmv
    - orders
