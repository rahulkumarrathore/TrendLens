kpi: gmv
formula: sum(qty * list_price * (1 - discount_pct)) [completed]
grain: day x region x category
parents:
- orders_kpi
- aov
sources:
- sales.orders
drivers:
- coupon_expiry
- competitor_promo
- marketing_gap
- supply_stockout
- gateway_issue
- demand_shift
levers:
  promotional_pricing: marketing_exec
thresholds:
  sigma: 2.0
  min_impact_inr: 8000
gate:
  persistence_n: 2
calendar: ISO
access:
  cfo:
    rows: all
    columns: all
  north_manager:
    rows: region = 'North'
    columns_exclude:
    - margin
    - cogs
    domains_exclude:
    - marketing_spend
  marketing_exec:
    rows: all
    columns_exclude:
    - margin
    - cogs
    - return_reason
  analyst_intern:
    rows: all
    columns_exclude:
    - sku
    - discount_pct
    min_grain: category
    domains_only:
    - gmv
    - orders
