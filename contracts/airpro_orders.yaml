kpi: airpro_orders
formula: count(distinct order_id) where sku='ELEC-AIRPRO-BLK'
grain: day
parents: []
sources:
- sales.orders
drivers:
- launch_volatility
- supply_stockout
levers: {}
thresholds:
  sigma: 2.0
  min_impact_inr: 8000
gate:
  persistence_n: 2
calendar: ISO
access:
  cfo:
    rows: all
    columns: all
  north_manager:
    rows: region = 'North'
    columns_exclude:
    - margin
    - cogs
    domains_exclude:
    - marketing_spend
  marketing_exec:
    rows: all
    columns_exclude:
    - margin
    - cogs
    - return_reason
  analyst_intern:
    rows: all
    columns_exclude:
    - sku
    - discount_pct
    min_grain: category
    domains_only:
    - gmv
    - orders
min_history_days: 60
history_days: 21
analogs:
- ELEC-SOUNDMAX-WHT
- ELEC-BASSLITE-BLU
confidence_penalty: 0.6
