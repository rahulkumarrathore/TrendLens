kpi: net_revenue
formula: gmv - returns - cancellations
grain: day x region x category
parents:
- gmv
sources:
- sales.orders
- sales.returns
drivers:
- return_spike
levers: {}
thresholds:
  sigma: 2.0
  min_impact_inr: 8000
gate:
  persistence_n: 2
calendar: ISO
access:
  cfo:
    rows: all
    columns: all
  north_manager:
    rows: region = 'North'
    columns_exclude:
    - margin
    - cogs
    domains_exclude:
    - marketing_spend
  marketing_exec:
    rows: all
    columns_exclude:
    - margin
    - cogs
    - return_reason
  analyst_intern:
    rows: all
    columns_exclude:
    - sku
    - discount_pct
    min_grain: category
    domains_only:
    - gmv
    - orders
settling_lag_days: 10
note: provisional until returns settle
