kpi: marketing_spend
formula: sum(spend)
grain: campaign x week
parents: []
sources:
- marketing.xlsx
drivers:
- budget_change
levers:
  campaign_spend: marketing_exec
thresholds:
  sigma: 2.0
  min_impact_inr: 8000
gate:
  persistence_n: 2
calendar: ISO
access:
  cfo:
    rows: all
    columns: all
  north_manager:
    rows: region = 'North'
    columns_exclude:
    - margin
    - cogs
    domains_exclude:
    - marketing_spend
  marketing_exec:
    rows: all
    columns_exclude:
    - margin
    - cogs
    - return_reason
  analyst_intern:
    rows: all
    columns_exclude:
    - sku
    - discount_pct
    min_grain: category
    domains_only:
    - gmv
    - orders
refresh: weekly_monday_flaky
